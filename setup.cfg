# Metadata for the Python extension built by setup.py. The local version label marks a build of
# this fork: pip resolves `quickfix==1.16.0` against it, and `pip show quickfix` tells a fork
# build from the PyPI one.
[metadata]
name = quickfix
version = 1.16.0+ethena.1
description = FIX (Financial Information eXchange) protocol implementation, with TLS hostname verification
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/sharpe5/quickfix
license_files = LICENSE

[options]
package_dir =
    = src/python
py_modules =
    quickfix
    quickfixt11
    quickfix40
    quickfix41
    quickfix42
    quickfix43
    quickfix44
    quickfix50
    quickfix50sp1
    quickfix50sp2
python_requires = >=3.8
